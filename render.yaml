services:
  - type: web
    name: repo-dog-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt || pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
